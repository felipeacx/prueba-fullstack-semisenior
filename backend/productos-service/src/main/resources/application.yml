spring:
  application:
    name: productos-service
  datasource:
    url: jdbc:postgresql://localhost:5432/productos_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8081
  servlet:
    context-path: /

logging:
  level:
    com.fullstack.productos: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

app:
  api:
    key: secret-key-productos

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

