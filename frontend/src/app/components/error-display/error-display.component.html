<div *ngIf="error" class="error-display">
  <div class="error-content">
    <span class="error-icon">⚠️</span>
    <p class="error-message">{{ error }}</p>
    <button 
      *ngIf="dismissible" 
      (click)="dismissError()"
      class="close-btn"
      aria-label="Cerrar error">
      ✕
    </button>
  </div>
</div>
